services:
  # MongoDB is NOT run locally — $vectorSearch is Atlas-only and unavailable
  # on plain mongo images. Set DATABASE_URL in backend/.env to a MongoDB
  # Atlas M0 (free tier) connection string; the backend service below reads
  # it from that file.
  redis:
    image: redis:7-alpine
    container_name: growth-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: growth-studio-backend
    restart: unless-stopped
    init: true
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      # DATABASE_URL comes from backend/.env (Atlas M0 connection string).
      # REDIS_URL is overridden here to the in-network Redis service name.
      REDIS_URL: redis://redis:6379
      WEB_URL: http://localhost:5173
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
