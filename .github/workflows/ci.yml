name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the in-flight run — three developers pushing small PRs
# daily (see SPEC-DRIVEN-WORKFLOW.md) otherwise queue up runs nobody reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches Dockerfile.prod's runtime image.
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # package-lock.json is written by npm 11; node:22 ships npm 10, and mismatched majors read
      # nested optional deps differently enough that `npm ci` fails outright. Same pin as
      # Dockerfile.prod — keep the two in step.
      - name: Pin npm to the lockfile's major
        run: npm install -g npm@11 --no-audit --no-fund

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No services needed: the suite runs against mongodb-memory-server, jest maps ioredis to
      # ioredis-mock, every LLM call is mocked, and .env.test supplies schema-valid placeholders.
      #
      # NOT a hard gate yet — 10 of 524 tests fail on `main` as of 2026-08-20, for two reasons that
      # both need a decision rather than a fix (see IMPROVEMENT-PLAN.md):
      #   * 9 tests assert `DEFAULT_FORMATS` is ['facebook_post', 'linkedin_post']; the code says
      #     ['facebook_post']. Whichever is right, changing it alters per-request LLM cost, so it is
      #     a product call.
      #   * 1 bake-off prompt-fidelity test: the harness's prompt has drifted from a live request's.
      # Remove `continue-on-error` the moment those are settled — a permanently-red gate is worse
      # than none, and a permanently-soft one stops meaning anything.
      - name: Test
        run: npm test
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this covers typechecking too.
      - name: Build
        run: npm run build
